name: test

on:
  push:
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -count=1 -race

  # The two jobs above run the BARE go commands, which resolve Wails' (and our) no-tag stubs — so
  # neither ever type-checks the Linux desktop path: the cgo that sits behind `dev`/`production`.
  # Without this job nothing compiles native_theme_linux.go until a release build does, which is
  # exactly how a broken cgo file reached a tag once already.
  linux-desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Same packages the release workflow's Linux build installs; ubuntu-latest is WebKit 4.1 only.
      - name: Install WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Compile the desktop build (cgo, GTK)
        run: go build -tags production,webkit2_41 ./...

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --check frontend/app.js
      - run: node --test frontend/app.test.mjs
