name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v0.1.0 or 0.1.0; must exist on GitHub and match VERSION)"
        required: true
      draft:
        description: "Create as draft release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.normalize.outputs.tag }}
    steps:
      - name: Normalize tag input
        id: normalize
        run: |
          raw="${{ inputs.tag }}"
          if [[ "$raw" == v* ]]; then
            tag="$raw"
          else
            tag="v$raw"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $tag"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.normalize.outputs.tag }}
      - name: Verify tag matches VERSION file
        run: |
          expected="v$(tr -d ' \n\r' < VERSION)"
          tag="${{ steps.normalize.outputs.tag }}"
          if [ "$tag" != "$expected" ]; then
            echo "Tag $tag does not match VERSION file ($expected)"
            exit 1
          fi
          echo "Tag matches VERSION: $expected"

  test:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./... -count=1
      - run: go vet ./...

  # Each job builds the app and then its platform's native installer, via the same
  # build/scripts/* the local `make package` uses:
  #   Linux → .deb + .rpm (fpm)   Windows → .msi (WiX)   macOS → .dmg (hdiutil)
  build:
    needs:
      - prepare
      - test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            arch: amd64
            platform: ""
          - os: windows-latest
            goos: windows
            arch: amd64
            platform: ""
          - os: macos-latest
            goos: darwin
            arch: universal
            platform: darwin/universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # WebKit 4.1 dev headers (Ubuntu 24.04+); the Makefile detects them and adds -tags webkit2_41
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Linux packaging tools (fpm, rpm)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends rpm ruby-dev
          sudo gem install --no-document fpm

      - name: Install Windows packaging tools (WiX, make)
        if: runner.os == 'Windows'
        run: choco install wixtoolset make --no-progress -y

      # Optional: only used to draw the DMG background; the script skips it when absent.
      - name: Install macOS packaging tools (Pillow)
        if: runner.os == 'macOS'
        run: pip3 install --quiet --break-system-packages Pillow || true

      - name: Build and package
        shell: bash
        run: make package-ci PLATFORM=${{ matrix.platform }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      # The release description is this version's CHANGELOG.md section — the human-readable
      # summary — plus the install notes below; nothing is auto-appended (see
      # generate_release_notes). The CHANGELOG.md link in the body is pinned to `main`, NOT the
      # tag: that way it always resolves and always shows the complete history, including
      # releases published after this one.
      - name: Extract changelog section
        id: changelog
        run: |
          version="$(tr -d ' \n\r' < VERSION)"
          # Print the body of the "## [<version>] ..." section, up to the next "## [" heading.
          notes="$(awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { flag=1; next }
            /^## \[/ && flag { flag=0 }
            flag { print }
          ' CHANGELOG.md)"
          # Trim leading/trailing blank lines.
          notes="$(printf '%s\n' "$notes" | sed -e '/./,$!d' | tac | sed -e '/./,$!d' | tac)"
          if [ -z "$notes" ]; then
            echo "::warning::No CHANGELOG.md section found for version $version"
          fi
          {
            echo "notes<<__CHANGELOG_EOF__"
            echo "$notes"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          draft: ${{ inputs.draft }}
          # OFF so the release description is exactly the body below. GitHub's generator always
          # ends with a "**Full Changelog**: <compare url>" footer and offers no way to suppress
          # just that line (.github/release.yml only categorises/excludes PRs) — and for this repo
          # the footer was ALL it produced: "What's Changed" is built from merged pull requests,
          # and this repo merges local branches instead, so v0.9.0's notes carried no such section.
          # If PRs ever become the workflow here, turning this back on brings that list back — and
          # the footer with it; dropping the footer alone then means fetching the notes from
          # POST /repos/{owner}/{repo}/releases/generate-notes and filtering that line out.
          generate_release_notes: false
          body: |
            ## What's new

            ${{ steps.changelog.outputs.notes }}

            📖 [CHANGELOG.md](https://github.com/michal-bartak/pgcowboy/blob/main/CHANGELOG.md) - all changes

            ### Installing

            - **macOS** — open `pgCowboy-${{ needs.prepare.outputs.tag }}-macos-universal.dmg` and drag **pgCowboy** to Applications. The build is unsigned, so Gatekeeper blocks the first launch; clear the quarantine flag once:
              ```
              xattr -dr com.apple.quarantine /Applications/pgCowboy.app
              ```
              Downloading with `curl -LJO <url>` instead of a browser avoids the flag entirely.
            - **Windows** — run `pgCowboy-${{ needs.prepare.outputs.tag }}-windows-amd64.msi`. SmartScreen may warn about the unsigned installer: **More info → Run anyway**.
            - **Linux (Debian/Ubuntu)** — `sudo apt install ./pgCowboy-${{ needs.prepare.outputs.tag }}-linux-amd64.deb`
            - **Linux (Fedora/RHEL)** — `sudo dnf install ./pgCowboy-${{ needs.prepare.outputs.tag }}-linux-amd64.rpm`

            See the [installation guide](https://michal-bartak.github.io/pgcowboy/installation/) for upgrade and uninstall notes.
          files: dist/*
