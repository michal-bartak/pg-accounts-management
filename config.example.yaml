# DbAccounts example config — copy structure only; app creates its own file on first launch.
#
# db_functions.<operation>.call — template body
# db_functions.<operation>.execution — function | statement | block (default: function)
# See sql/README.md
#
# Create role: ARRAY['fixed_group', ...] || ${parent_role}
#   - empty parent role in UI → SQL "... || NULL"
#   - set parent role → "... || $n::text[]"

version: 1
# Cluster groups. color = base hex (shades derived); confirm = require the
# production-style confirm popup before running against that group's clusters.
# Edit these in-app under Settings → Cluster groups.
categories:
  - id: production
    label: Production
    color: "#e8a838"
    confirm: true
  - id: uat
    label: UAT
    color: "#6eb5ff"
    confirm: false
clusters: []
# Defaults are vanilla PostgreSQL DDL (statement mode), shown below. Override any command
# with a privileged wrapper function (execution: function) or a PL/pgSQL block — e.g. so a
# low-privilege connect user can act through a SECURITY DEFINER function that also writes an
# audit log or sends a notification. Commented variants illustrate the alternatives.
db_functions:
  create_role:
    execution: statement
    call: "CREATE ROLE ${loginname}"
  # create_role:
  #   execution: function   # fullname/email/parent_role available; ARRAY['grp'] || ${parent_role}
  #   call: "admin_access.create_role(${loginname}, NULL, ${fullname}, ${email}, ARRAY['gr_personal_users'] || ${parent_role})"
  remove_role:
    execution: statement
    call: "DROP ROLE ${loginname}"
  # remove_role:
  #   execution: function
  #   call: "your_schema.remove_app_role(${loginname})"
  # remove_role:
  #   execution: block   # a complete anonymous block, run verbatim (write your own DO/delimiter)
  #   call: |
  #     DO $do$ BEGIN
  #       DROP ROLE ${loginname};
  #     END $do$;
  grant_parents:
    execution: statement
    call: "GRANT ${parent_roles} TO ${loginname}"
  # grant_parents:
  #   execution: function
  #   call: "your_schema.grant_role_parents(${loginname}, ${parent_roles})"
  revoke_parents:
    execution: statement
    call: "REVOKE ${parent_roles} FROM ${loginname}"
  # revoke_parents:
  #   execution: function
  #   call: "your_schema.revoke_role_parents(${loginname}, ${parent_roles})"
  change_password:
    execution: statement
    call: "ALTER ROLE ${loginname} PASSWORD ${new_password}"
  # change_password:
  #   execution: function
  #   call: "your_schema.change_role_password(${loginname}, ${new_password})"
  set_comment:
    execution: statement
    call: "COMMENT ON ROLE ${loginname} IS ${comment}"
  set_attribute:
    execution: statement
    call: "ALTER ROLE ${loginname} WITH ${attribute}"
  set_config:
    execution: statement
    call: "ALTER ROLE ${loginname} SET ${config_name} = ${config_value}"
  reset_config:
    execution: statement
    call: "ALTER ROLE ${loginname} RESET ${config_name}"

# db_reads: the read/introspection queries used by Alter role. Plain SQL with a single $1 bind
# (search pattern for search_roles; role name for role_detail/role_parents). Result columns are
# scanned BY NAME against a fixed contract (see sql/README.md → Introspection queries): column
# order is irrelevant, NULL comment/rolconfig is fine, an omitted contract column is treated as
# zero, and an extra unmapped column is an error. Defaults are vanilla catalog queries; override a
# read with a privileged wrapper function/view (e.g. SELECT rolname, comment FROM admin.search($1))
# when the connect user cannot read the catalogs directly. Omit a key to use its default.
db_reads:
  search_roles:
    # Contract columns: rolname (text), comment (text, nullable).
    query: |
      SELECT r.rolname AS rolname,
             d.description AS comment
      FROM pg_roles r
      LEFT JOIN pg_shdescription d
        ON d.objoid = r.oid AND d.classoid = 'pg_authid'::regclass
      WHERE r.rolname ILIKE $1 OR d.description ILIKE $1
      ORDER BY r.rolname
  role_detail:
    # Contract columns (one row): rolsuper, rolcreaterole, rolcreatedb, rolinherit, rolcanlogin,
    # rolreplication, rolbypassrls (bool), comment (text, nullable), rolconfig (text[], nullable).
    query: |
      SELECT r.rolsuper AS rolsuper,
             r.rolcreaterole AS rolcreaterole,
             r.rolcreatedb AS rolcreatedb,
             r.rolinherit AS rolinherit,
             r.rolcanlogin AS rolcanlogin,
             r.rolreplication AS rolreplication,
             r.rolbypassrls AS rolbypassrls,
             d.description AS comment,
             r.rolconfig AS rolconfig
      FROM pg_roles r
      LEFT JOIN pg_shdescription d
        ON d.objoid = r.oid AND d.classoid = 'pg_authid'::regclass
      WHERE r.rolname = $1
  role_parents:
    # Contract columns (one row per parent): rolname (text).
    query: |
      SELECT g.rolname AS rolname
      FROM pg_auth_members m
      JOIN pg_roles g ON g.oid = m.roleid
      JOIN pg_roles u ON u.oid = m.member
      WHERE u.rolname = $1
      ORDER BY g.rolname
batch:
  max_concurrency: 5

# ui.theme: light | dark | system (follow OS appearance)
# ui.comment_default_view: fields | raw — preferred comment editor mode for a NEW/empty
#   comment (Create role, or a role with no comment). Content-bearing comments auto-detect.
ui:
  theme: system
  comment_default_view: fields

# targets: the last Operations-page target selection, remembered across restarts. Managed by
# the app (updated whenever you toggle a group/cluster checkbox). Omit or leave empty for the
# default "all groups selected".
# targets:
#   category_ids: [production, uat]
#   cluster_ids: [prod_eu_1]

# parent_roles: preconfigured parent groups offered as pick-list choices when granting
# privileges (Create role / Alter role). Bare identifiers; several can be granted at once.
parent_roles:
  - gr_devs_ro
  - gr_reporting
  - gr_admins

# comment_fields: JSON keys surfaced as labeled inputs in the role form when a role's
# COMMENT holds JSON. Ordered; keys not listed here are still shown generically. Keys are
# bare identifiers. Defaults to full_name/e_mail when omitted. Plain-text comments are
# edited via the Raw view regardless of this list.
comment_fields:
  - key: full_name
    label: Full name
  - key: e_mail
    label: Email
