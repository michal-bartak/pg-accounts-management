# Vale — local prose linter for the docs (https://vale.sh).
# One-time setup after install:  vale sync   (downloads the style packages below)
# Run:  vale docs/src/content/docs
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Downloaded by `vale sync` into StylesPath. Google = the Google developer docs
# style guide; write-good = wordiness/passive/weasel words.
Packages = Google, write-good

Vocab = pgCowboy

[*.md]
BasedOnStyles = Vale, Google, write-good, Buzzwords
# Don't lint inside repository slugs / URLs shown as link text (e.g. github.com/owner/repo).
TokenIgnores = (github\.com/\S+)

# Headings are short labels, not sentences — don't demand a period.
Google.Headings = warning
# House style uses spaced em-dashes (word — word); Google prefers unspaced. Keep ours.
Google.EmDash = NO
# We use some second-person imperatives and product nouns Google flags; keep them
# as suggestions so real problems (wordiness, passive voice, buzzwords) stand out.
Google.We = suggestion
write-good.E-Prime = NO
# The project uses British spelling (colour, organise); don't force American forms.
Google.Spelling = NO
